[package]
name = "timbre-core"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
timbre-tbr = { path = "../timbre-tbr" }
wgpu = "30"
winit = "0.30"
log = "0.4"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
# Instant, das auch im Browser funktioniert (std::time::Instant stürzt dort ab).
web-time = "1"
