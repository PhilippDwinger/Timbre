[package]
name = "timbre-core"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
timbre-tbr = { path = "../timbre-tbr" }
wgpu = "30"
winit = "0.30"
log = "0.4"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
# Instant, das auch im Browser funktioniert (std::time::Instant stürzt dort ab).
web-time = "1"
# ECS: Objekte (Entities) mit Bausteinen (Komponenten)
hecs = "0.11"
# Szenen als lesbares JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Scripting-Host (nativ). Im Browser übernimmt das später die eingebaute WebAssembly-Laufzeit.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std", "gc", "gc-drc", "parallel-compilation"] }
